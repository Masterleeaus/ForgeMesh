name: Validate repository archive

on:
  push:
    branches: [main]
    paths:
      - 'agents-profiles-main.zip'
      - '.github/workflows/unzip-repository.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate archive without mutating the checkout
        shell: bash
        run: |
          set -euo pipefail
          ZIP='agents-profiles-main.zip'
          if [ ! -f "$ZIP" ]; then
            echo 'No repository archive is present; archive validation is not applicable.'
            exit 0
          fi

          unzip -t "$ZIP"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          unzip -q "$ZIP" -d "$WORK"

          shopt -s dotglob nullglob
          entries=("$WORK"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SOURCE="${entries[0]}"
          else
            SOURCE="$WORK"
          fi

          echo "Archive validated for read-only inspection from: $SOURCE"
