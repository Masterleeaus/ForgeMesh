name: Validate ForgeMesh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-validation:
    name: Root corpus validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run portable root validator
        run: bash validate.sh

  cli-validation:
    name: Nested CLI validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents-profiles-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agents-profiles-cli/package-lock.json

      - name: Install nested CLI dependencies
        run: npm ci

      - name: Typecheck nested CLI
        run: npm run typecheck

      - name: Build nested CLI
        run: npm run build
