<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">ForgeMesh Adaptive Engineering Workforce architecture</title><desc id="desc">Repository intelligence normalizes a system model, selects specialist profiles from the canonical registry, compiles platform outputs, and executes bounded work with verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21172d"/><stop offset="1" stop-color="#6c3f78"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a7f1d0"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#a7f1d0}.t{font:700 32px Segoe UI,Arial;fill:#fff9ff}.s{font:400 15px Segoe UI,Arial;fill:#f4e4f1}.n{fill:#533061;stroke:#a35c92;stroke-width:2}.g{fill:#6c3f78;stroke:#a7f1d0;stroke-width:2}.y{fill:#31554e;stroke:#f5c379;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#eedbeb}.q{font:400 12px Segoe UI,Arial;fill:#d7bed4}.r{stroke:#a7f1d0;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">FORGEMESH � SOURCE-TO-WORKFORCE PIPELINE</text><text x="64" y="106" class="t">Assemble only the capabilities the system and task require</text><text x="64" y="136" class="s">Source-backed from 22 category directories, 340 canonical profiles, agents-profiles-cli/, and npm scripts.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Repository / workspace</text><text x="195" y="290" text-anchor="middle" class="b">stack � services � tests</text><text x="195" y="318" text-anchor="middle" class="q">source evidence</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">System model</text><text x="555" y="290" text-anchor="middle" class="b">architecture + risk</text><text x="555" y="318" text-anchor="middle" class="q">normalized project detection</text><path d="M680 285H790" class="r"/><rect x="790" y="220" width="250" height="130" rx="16" class="g"/><text x="915" y="260" text-anchor="middle" class="l">Capability matcher</text><text x="915" y="290" text-anchor="middle" class="b">minimum-sufficient team</text><text x="915" y="318" text-anchor="middle" class="q">canonical profile registry</text><path d="M1040 285H1150" class="r"/><rect x="1150" y="220" width="280" height="130" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Platform projections</text><text x="1290" y="290" text-anchor="middle" class="b">Claude � Copilot � OpenCode</text><text x="1290" y="318" text-anchor="middle" class="q">generated native outputs</text><path d="M1290 350V500H1050" class="r"/><rect x="700" y="520" width="650" height="92" rx="16" class="n"/><text x="1025" y="557" text-anchor="middle" class="l">Bounded execution + verification</text><text x="1025" y="584" text-anchor="middle" class="q">review generated diffs � preserve responsibilities � validate links and handoffs</text></svg>

