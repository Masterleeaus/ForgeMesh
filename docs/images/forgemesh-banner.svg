<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">ForgeMesh Adaptive Engineering Workforce</title><desc id="desc">A magenta and mint adaptive workforce banner showing repository scan, architecture map, specialist selection, execution, and evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21172d"/><stop offset="1" stop-color="#6c3f78"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 40px Segoe UI,Arial;fill:#fff9ff}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.2px;fill:#f4e4f1}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#a7f1d0}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#e0c9dd}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1080" cy="35" r="220" fill="#a7f1d0" opacity=".12"/><text x="70" y="66" class="e">FORGEMESH � REPOSITORY INTELLIGENCE � 340 PROFILES / 22 CATEGORIES</text><text x="70" y="125" class="t">ForgeMesh Adaptive Engineering Workforce</text><text x="72" y="160" class="s">SCAN    MAP    ASSEMBLE    EXECUTE    VERIFY WITH EVIDENCE</text><path d="M110 245H1090" stroke="#a35c92" stroke-width="2"/><path d="M144 245H1050" stroke="#a7f1d0" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#5a326a" stroke="#a7f1d0" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Scan</text><text x="144" y="312" text-anchor="middle" class="q">system + stack</text><circle cx="383" cy="245" r="24" fill="#5a326a" stroke="#a7f1d0" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Map</text><text x="383" y="312" text-anchor="middle" class="q">architecture + risks</text><circle cx="622" cy="245" r="24" fill="#5a326a" stroke="#a7f1d0" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Assemble</text><text x="622" y="312" text-anchor="middle" class="q">minimum-sufficient team</text><circle cx="861" cy="245" r="24" fill="#5a326a" stroke="#a7f1d0" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="l">Execute</text><text x="861" y="312" text-anchor="middle" class="q">bounded handoffs</text><circle cx="1050" cy="245" r="24" fill="#31554e" stroke="#f5c379" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Evidence</text><text x="1050" y="312" text-anchor="middle" class="q">independent verification</text></g><text x="70" y="342" class="q">Deterministic detection and catalog matching do not require an API key</text></svg>

